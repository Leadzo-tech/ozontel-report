name: Deploy Ozonetel Report Prod

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ENVIRONMENT: prod
  PYTHON_VERSION: "3.12"
  FUNCTION_NAME: ozonetel-cdr-proxy-poc

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate scheduled report specs
        run: python -m src.validate_specs
      - name: Run tests
        run: pytest -q

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: ozonetel-report-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install runner dependencies
        run: pip install -r requirements-dev.txt
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::018100542607:role/ozonetel-cdr-proxy-poc-github-actions-role
          role-session-name: ozonetel-report-prod-deploy

      - name: Build Lambda zip
        run: |
          set -euo pipefail
          rm -rf build lambda.zip
          mkdir build
          pip install -r requirements.txt -t build/ \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 3.12 \
            --implementation cp --abi cp312
          cp -r src scheduled_reports build/
          (cd build && zip -qr ../lambda.zip . -x "*/__pycache__/*" "__pycache__/*")
          ls -lh lambda.zip

      - name: Update Lambda code
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip \
            --publish > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Update GIT_SHA and Ozonetel credentials
        env:
          OZONETEL_API_KEY: ${{ secrets.OZONETEL_API_KEY }}
          OZONETEL_USERNAME: ${{ secrets.OZONETEL_USERNAME }}
        run: |
          set -euo pipefail
          current=$(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' --output json)
          echo "$current" | jq \
            --arg sha "$GITHUB_SHA" \
            --arg ozkey "$OZONETEL_API_KEY" \
            --arg ozuser "$OZONETEL_USERNAME" \
            '. + {GIT_SHA: $sha, OZONETEL_API_KEY: $ozkey, OZONETEL_USERNAME: $ozuser} | {Variables: .}' > /tmp/env.json
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment file:///tmp/env.json > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Resolve Lambda ARN
        id: lambda
        run: |
          set -euo pipefail
          lambda_arn=$(aws lambda get-function --function-name "$FUNCTION_NAME" --query 'Configuration.FunctionArn' --output text)
          echo "lambda_arn=$lambda_arn" >> "$GITHUB_OUTPUT"

      - name: Reconcile EventBridge schedules
        run: |
          python -m src.eventbridge_sync \
            --environment "${ENVIRONMENT}" \
            --lambda-arn "${{ steps.lambda.outputs.lambda_arn }}" \
            --lambda-function-name "$FUNCTION_NAME"
