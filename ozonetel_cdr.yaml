# Declarative config for the Ozonetel CDR -> Sheet sync, matching the
# scheduled_queries/*.yaml pattern from data-pipelines (sheet target lives
# here, not hardcoded in Python — change the sheet without a code change).
sheet:
  spreadsheet_id: 1WsTggCbZbSBV4DeAzznebcH51o8pJUFLOdVJMFMrhE0
  worksheet_name: Ozonetel
  start_cell: A1
  include_headers: true
  clear_before_write: true
  columns:
    preferred_order:
      - CallID
      - CallDate
      - StartTime
      - EndTime
      - Duration
      - TalkTime
      - HandlingTime
      - CallerID
      - DialedNumber
      - E164
      - DID
      - Location
      - AgentID
      - AgentName
      - Skill
      - CampaignName
      - CallFlow
      - Type
      - Status
      - DialStatus
      - AgentDialStatus
      - CustomerDialStatus
      - Disposition
      - Comments
      - HangupBy
      - QueueTime
      - HoldDuration
      - WrapupDuration
      - TimeToAnswer
      - DialCount
      - UCID
      - UUI
      - CallAudio

pull_window:
  days_back_full: 15
  days_back_routine: 2
  rate_limit_sleep_seconds: 31
