report_name: ozonetel-cdr-sync
enabled: true
schedule:
  # EventBridge rate()/cron() — cron is UTC, rate() is interval-based.
  expression: rate(5 minutes)
  timezone: Asia/Kolkata
ozonetel:
  endpoint: https://in1-ccaas-api.ozonetel.com/ca_reports/fetchCDRDetails
  # Ozonetel retains 15 days of CDRs. A routine run re-pulls the last 2 days so
  # late-arriving/updated records get picked up without redoing the whole
  # window every 5 minutes; full_backfill: true in the payload pulls all 15.
  days_back_routine: 2
  days_back_full: 15
  # fetchCDRDetails is rate-limited to 2 requests/minute, so sleep between days.
  rate_limit_sleep_seconds: 31
sheet:
  spreadsheet_id: 1WsTggCbZbSBV4DeAzznebcH51o8pJUFLOdVJMFMrhE0
  worksheet_name: Ozonetel
  start_cell: A1
  include_headers: true
  clear_before_write: true
  columns:
    preferred_order:
      - CallID
      - CallDate
      - StartTime
      - EndTime
      - Duration
      - TalkTime
      - HandlingTime
      - CallerID
      - DialedNumber
      - E164
      - DID
      - Location
      - AgentID
      - AgentName
      - Skill
      - CampaignName
      - CallFlow
      - Type
      - Status
      - DialStatus
      - AgentDialStatus
      - CustomerDialStatus
      - Disposition
      - Comments
      - HangupBy
      - QueueTime
      - HoldDuration
      - WrapupDuration
      - TimeToAnswer
      - DialCount
      - UCID
      - UUI
      - CallAudio
      - CallerConfAudioFile
      - ConferenceDuration
      - CustomerRingTime
      - DialOutName
      - DynamicDID
      - Event
      - PickupTime
      - Rating
      - RatingComments
      - TransferType
      - TransferredTo
      - VideoRecordingURL
      - WrapUpEndTime
      - WrapUpStartTime
notifications:
  slack_webhook_param: /leadzo/ozonetel-cdr-proxy-poc/poc/slack/default-webhook-url
