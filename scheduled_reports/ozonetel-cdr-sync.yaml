report_name: ozonetel-cdr-sync
enabled: true
schedule:
  # EventBridge rate()/cron() — cron is UTC, rate() is interval-based.
  # Hourly on the hour IST (xx:00). IST = UTC+5:30, so that's minute 30 in UTC.
  expression: cron(30 * * * ? *)
  # One-off runs, each its own EventBridge rule (input is added to the event),
  # e.g. - {id: backfill-YYYYMMDD, expression: cron(M H D MON ? YYYY),
  #         input: {full_backfill: true, replace: true}}
  # Remove an entry once it has run; the next deploy deletes its rule.
  extra_runs:
    # 2026-09-23 18:10 IST: re-pull all 15 retained days (merge mode replaces
    # each day in full) so older rows get the new AssignedAgent column.
    - id: backfill-20260923b
      expression: cron(40 12 23 9 ? 2026)
      input:
        full_backfill: true
  timezone: Asia/Kolkata
ozonetel:
  endpoint: https://in1-ccaas-api.ozonetel.com/ca_reports/fetchCDRDetails
  # Ozonetel retains 15 days of CDRs. A routine run re-pulls the last 2 days so
  # late-arriving/updated records get picked up without redoing the whole
  # window every hour; full_backfill: true in the payload pulls all 15.
  days_back_routine: 2
  days_back_full: 15
  # fetchCDRDetails is rate-limited to 2 requests/minute, so sleep between days.
  rate_limit_sleep_seconds: 31

  # THE SHEET'S COLUMNS. Left = header text written to the sheet.
  # Right = the Ozonetel API field it reads from.
  #   add a column     -> add a line
  #   remove a column  -> delete the line
  #   rename a header  -> change the left side (e.g. `Talk Time: TalkTime`)
  #   reorder          -> move the line
  # Unlisted API fields are dropped. A field Ozonetel doesn't return writes an
  # empty column rather than failing.
  projection:
    CallID: CallID
    CallDate: CallDate
    StartTime: StartTime
    EndTime: EndTime
    Duration: Duration
    TalkTime: TalkTime
    HandlingTime: HandlingTime
    CallerID: CallerID
    DialedNumber: DialedNumber
    E164: E164
    DID: DID
    Location: Location
    AgentName: AgentName
    # Not an Ozonetel field: filled in by the sync from the call's other legs
    # (who answered, else who it was offered to). Blank = never assigned.
    AssignedAgent: AssignedAgent
    Skill: Skill
    CampaignName: CampaignName
    CallFlow: CallFlow
    Type: Type
    Status: Status
    DialStatus: DialStatus
    AgentDialStatus: AgentDialStatus
    CustomerDialStatus: CustomerDialStatus
    Disposition: Disposition
    Comments: Comments
    HangupBy: HangupBy
    QueueTime: QueueTime
    HoldDuration: HoldDuration
    WrapupDuration: WrapupDuration
    TimeToAnswer: TimeToAnswer
    DialCount: DialCount
    UUI: UUI
    CallAudio: CallAudio
    ConferenceDuration: ConferenceDuration
    CustomerRingTime: CustomerRingTime
    Event: Event
    PickupTime: PickupTime
    WrapUpEndTime: WrapUpEndTime
    WrapUpStartTime: WrapUpStartTime
sheet:
  spreadsheet_id: 1WsTggCbZbSBV4DeAzznebcH51o8pJUFLOdVJMFMrhE0
  worksheet_name: Ozonetel
  start_cell: A1
  include_headers: true
  # merge: keep every day already on the sheet and replace only the days just
  # fetched with Ozonetel's rows for them, so history builds up past the
  # 15-day retention. Whole days, because a CallID repeats for every leg and
  # ring attempt of a call — rows can't be matched one by one.
  write_mode: merge
  date_column: CallDate
notifications:
  slack_webhook_param: /leadzo/ozonetel-cdr-proxy-poc/poc/slack/default-webhook-url
