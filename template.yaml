# NOTE: descriptive only — NOT deployed by CI or by any script in this repo.
#
# ozonetel-cdr-proxy-poc, its execution role, and the ozonetel-cdr-sync-hourly
# EventBridge rule were created manually via the AWS CLI and stay CLI/CI
# managed (see .github/workflows/deploy.yml). This file documents their
# current shape for readability, mirroring data-pipelines/template.yaml, but
# running `sam deploy` against it would attempt to create a *new* stack that
# collides with those already-existing resources. Don't deploy this without
# first importing the existing resources into the stack.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ozonetel CDR -> Google Sheet sync (reference only, not deployed).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    Timeout: 300
    ReservedConcurrentExecutions: 1

Resources:
  OzonetelCdrProxy:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ozonetel-cdr-proxy-poc
      CodeUri: .
      Handler: handler.handler
      Environment:
        Variables:
          OZONETEL_USERNAME: leadzo
          GOOGLE_SA_JSON_PARAM: /leadzo/ozonetel-cdr-proxy-poc/poc/google/sa-json
          # OZONETEL_API_KEY is set out-of-band (CI secret / manual), never here.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: arn:aws:ssm:ap-south-1:018100542607:parameter/leadzo/ozonetel-cdr-proxy-poc/poc/google/sa-json
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: arn:aws:kms:ap-south-1:018100542607:key/4aaee9b5-de9d-43ad-be4a-51ff1e7ce70f
      Events:
        HourlySchedule:
          Type: Schedule
          Properties:
            Name: ozonetel-cdr-sync-hourly
            Schedule: rate(5 minutes)
            Enabled: true

Outputs:
  FunctionArn:
    Value: !GetAtt OzonetelCdrProxy.Arn
