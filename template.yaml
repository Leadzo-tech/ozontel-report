# NOTE: descriptive only — NOT deployed by CI.
#
# ozonetel-cdr-proxy-poc, its execution role, and its EventBridge rule were
# created via the AWS CLI and stay CLI/CI-managed (code by
# .github/workflows/deploy-prod.yml, schedules by src/eventbridge_sync.py).
# This file documents their current shape, mirroring data-pipelines/template.yaml.
# Running `sam deploy` against it would try to create a *new* stack colliding
# with those existing resources — import them first if you ever adopt SAM here.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Ozonetel CDR -> Google Sheets report worker (reference only, not deployed).

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [prod]
  SsmParameterPrefix:
    Type: String
    Default: /leadzo/ozonetel-cdr-proxy-poc/poc
  GitSha:
    Type: String
    Default: unknown

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 512
    # 900s (the max) so a full_backfill — 16 days x ~31s rate-limit sleep — fits.
    Timeout: 900
    LoggingConfig:
      LogFormat: Text

Resources:
  OzonetelReportWorker:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ozonetel-cdr-proxy-poc
      CodeUri: .
      Handler: src.handler.handle
      # One run must never overlap the next — every run clears and rewrites the
      # same worksheet, so two concurrent runs would race on the same range.
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SSM_PARAMETER_PREFIX: !Ref SsmParameterPrefix
          GOOGLE_SA_JSON_PARAM: !Sub ${SsmParameterPrefix}/google/sa-json
          OZONETEL_USERNAME: leadzo
          GIT_SHA: !Ref GitSha
          # OZONETEL_API_KEY is injected by CI from a GitHub secret, never here.
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmParameterPrefix}/*
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: "*"

Outputs:
  OzonetelReportWorkerArn:
    Value: !GetAtt OzonetelReportWorker.Arn
  OzonetelReportWorkerName:
    Value: !Ref OzonetelReportWorker
